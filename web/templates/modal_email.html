{{define "modal_email"}}
<div x-data="{ open: false, email: '', gems: true, guard: true, sentinel: true, statusMsg: '', isError: false, loading: false }"
     @keydown.escape.window="open = false">
  
  <button @click="open = true" class="pill alert-btn-pulse">
    <span class="bell-icon">🔔</span> <span>Email Alerts</span>
  </button>

  <div x-show="open" 
       x-transition.opacity.duration.200ms
       class="modal-backdrop"
       x-cloak>
    
    <div @click.away="open = false" 
         x-show="open"
         x-transition.duration.200ms
         class="card modal-glow-box modal-dialog">
      
      <div class="modal-head">
        <h3 class="modal-title">
          <span class="modal-gem">◆</span> Email Alert Preferences
        </h3>
        <button @click="open = false" class="modal-close-btn">&times;</button>
      </div>

      <p class="modal-lead">
        Receive quantitative digests and market anomaly alerts directly in your inbox during scheduled screening cycles (00/06/12/18 WIB).
      </p>

      <form @submit.prevent="
        loading = true;
        statusMsg = '';
        fetch('/api/v1/subscribe', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email: email, notify_gems: gems, notify_guard: guard, notify_sentinel: sentinel})
        })
        .then(r => r.json())
        .then(d => {
          loading = false;
          if (d.error) { isError = true; statusMsg = d.error; }
          else { isError = false; statusMsg = 'Email subscription preferences saved successfully!'; }
        })
        .catch(e => { loading = false; isError = true; statusMsg = 'System error occurred.'; });
      ">
        
        <div class="field">
          <label class="field-label">Recipient Email</label>
          <input type="email" x-model="email" required placeholder="name@domain.com" class="custom-email-input">
        </div>

        <div class="check-list">
          <label class="check-row">
            <input type="checkbox" x-model="gems">
            <span><b class="tone-gem">Top 10 Gems</b> (Graham + Lynch Screening)</span>
          </label>
          <label class="check-row">
            <input type="checkbox" x-model="guard">
            <span><b class="tone-guard">Gem Guard</b> (High Risk / PIR & UMA Signals)</span>
          </label>
          <label class="check-row">
            <input type="checkbox" x-model="sentinel">
            <span><b class="tone-sentinel">Gem Sentinel</b> (Distress Radar / Springate)</span>
          </label>
        </div>

        <template x-if="statusMsg">
          <div class="status-banner" :class="isError ? 'status-err' : 'status-ok'" x-text="statusMsg"></div>
        </template>

        <div class="btn-row">
          <button type="button" 
                  class="btn-secondary-cool"
                  @click="
                    if (!email) { isError = true; statusMsg = 'Please enter an email address first.'; return; }
                    loading = true;
                    statusMsg = '';
                    fetch('/api/v1/email/test', {
                      method: 'POST',
                      headers: {'Content-Type': 'application/json'},
                      body: JSON.stringify({email: email})
                    })
                    .then(r => r.json())
                    .then(d => {
                      loading = false;
                      if (d.error) { isError = true; statusMsg = d.error; }
                      else { isError = false; statusMsg = 'Test email dispatched! Check your inbox/spam folder.'; }
                    })
                    .catch(e => { loading = false; isError = true; statusMsg = 'Failed to send test email.'; });
                  ">
            Send Test Email
          </button>
          
          <button type="submit" :disabled="loading" class="btn-primary-cool">
            <span x-show="!loading">Save Preferences</span>
            <span x-show="loading" class="btn-loading">
              <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                <path d="M12 2a10 10 0 0 1 10 10"></path>
              </svg>
              Saving...
            </span>
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
{{end}}
